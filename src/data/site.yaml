about:
  paragraphs:
    - >-
      Saudi computer scientist with an M.S. in Computer Science from the University of Nevada,
      Las Vegas, focused on <em>AI and cybersecurity</em>. My thesis builds a machine-learning
      pipeline that detects advanced persistent threats hiding in encrypted network traffic,
      turning raw flow timestamps into a ranked shortlist that reduces analyst workload by up to 99%.
    - >-
      Alongside the degree I worked on the <em>Mobile Team</em> at UNLV's Office of Information
      Technology as a Software Engineer in Test, building end-to-end Detox automation across iOS
      and Android. My research extends into <em>adversarial machine learning</em>, <em>federated
      learning</em>, and <em>differential privacy</em>, three pillars of secure and trustworthy AI.
    - >-
      Native Arabic, fluent English. SDAIA-certified in AI fundamentals and advanced applications.
      Based in Riyadh.
